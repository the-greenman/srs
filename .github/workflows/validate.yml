name: Validate

# The repository's own conformance registry, run on every pull request.
#
# `scripts/checks.json` declares every spec-repo check; `validate-all.mjs` is a
# loop over its `always`-tier entries, in array order. Until this workflow
# existed, that loop ran only when somebody remembered to run it locally — the
# 39 declared checks were a local habit, not a gate. The registry's own
# membership guard (`check-checks-registry-membership.mjs`) makes a new check
# impossible to land undeclared; this workflow makes a declared check
# impossible to skip.
#
# Scope: the `always` tier only. `pinned-cli` checks need the pinned `srs`
# binary and run in Release Drift, which already fetches and checksum-verifies
# it. Splitting them that way keeps this job dependency-free and fast, and
# keeps the pinned-binary reasoning in exactly one workflow.

on:
  push:
  # `edited` (not just the default opened/synchronize/reopened) so pr-classification actually
  # re-checks a PR body correction: the check's own PR_BODY input is GitHub Actions' frozen event
  # payload, which a body edit alone never retriggers under the default set, and re-running the
  # same job replays that same frozen payload rather than fetching the corrected text (found
  # fixing srs#723's own classification line after check-pr-classification.mjs — srs#716 — landed
  # underneath it mid-review).
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate:
    name: validate-all
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history), not the default shallow depth-1 clone: check-versioning-cell.mjs
      # (srs#649) diffs each Field file's own commit history, which needs more than the tip commit to
      # see. A depth-1 checkout would let that check run and report green while never actually
      # comparing two revisions of anything.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # By exit code, never by output tail — a piped tail eats the status and
      # turns a red gate green (CLAUDE.md, "Gates and choreography").
      - name: Run the declared check registry
        run: node scripts/validate-all.mjs

  # scripts/checks.json's `pr-classification` entry is `tier: ci-only` — declaring it in the
  # registry does not make anything run it (rfc-decision-19997e24's own accepted cost: "the
  # ci-only tier can declare a check but cannot enforce that the CI workflow actually runs it").
  # This job is that enforcement (srs#716). PR-only: github.event.pull_request only exists on a
  # pull_request-triggered run, so a push run has nothing to check here.
  pr-classification:
    name: pr-classification
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # The PR body and label names are read into env vars by the Actions expression evaluator, not
    # interpolated into a shell command — a PR body is attacker-controlled text (backticks, `$(...)`,
    # etc.), and putting it directly in a `run:` string would be a command-injection sink. The script
    # reads them from process.env, never from argv, in this job.
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the PR's Mode/Cell/Door classification line
        run: node scripts/check-pr-classification.mjs
